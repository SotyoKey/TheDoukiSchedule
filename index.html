<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベントスケジュール</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .filter-section {
      text-align: center;
      margin: 20px 0;
    }
    select {
      padding: 10px 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
    }
    .event-card {
      background: #fafafa;
      border-left: 5px solid #3498db;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .event-card.team {
      border-left-color: #e74c3c;
    }
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .event-title {
      font-size: 18px;
      font-weight: bold;
    }
    .event-time {
      font-size: 16px;
      color: #7f8c8d;
    }
    .event-type {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 12px;
      color: #fff;
      margin-right: 10px;
    }
    .type-team { background-color: #e74c3c; }
    .type-solo { background-color: #3498db; }
    .members-list {
      margin: 5px 0 0 0;
      padding-left: 20px;
      color: #555;
      list-style-type: none;
    }
    .members-list li {
      margin-bottom: 5px;
    }
    .no-members {
      color: #999;
      font-style: italic;
    }
    .empty-message {
      text-align: center;
      color: #7f8c8d;
      margin-top: 20px;
    }
    .team-label {
      font-weight: bold;
      color: #2c3e50;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎮 ゲームイベントスケジュール</h1>
  
  <div class="filter-section">
    <select id="dateSelect">
      <option value="all">すべての日程を表示</option>
    </select>
  </div>

  <div id="eventContainer">
    </div>
</div>

<script>
  const events = [
    { date: '2026-04-18', displayDate: '2026-04-18(土)', time: '20:00', type: '個人戦', game: '雀魂 A', members: [] },
    { date: '2026-04-18', displayDate: '2026-04-18(土)', time: '22:00', type: 'チーム戦', game: 'PEAK', members: [] },
    { date: '2026-04-18', displayDate: '2026-04-18(土)', time: '22:00', type: '個人戦', game: 'ギルティギア Ａ', members: ['noteさん', 'ソルティーさん'] },
    
    { date: '2026-04-19', displayDate: '2026-04-19(日)', time: '13:00', type: 'チーム戦', game: 'リーグオブレジェンド上級者', members: [] },
    { date: '2026-04-19', displayDate: '2026-04-19(日)', time: '13:00', type: 'チーム戦', game: 'リーグオブレジェンド(初心者)', members: [] },
    { date: '2026-04-19', displayDate: '2026-04-19(日)', time: '13:00', type: '個人戦', game: 'バックショットルーレット B', members: ['凍結さん', 'ユッケさん', 'カルミアさん', 'ぐれーぷしゅがーさん'] },
    { date: '2026-04-19', displayDate: '2026-04-19(日)', time: '20:00', type: '個人戦', game: 'バックショットルーレット A', members: ['tuki022さん', 'さぬきさん', 'ポテトさん', 'ベル君さん'] },
    { date: '2026-04-19', displayDate: '2026-04-19(日)', time: '22:00', type: '個人戦', game: 'ギルティギア Ｃ', members: ['tuki022さん', '凍結さん'] },

    { date: '2026-04-20', displayDate: '2026-04-20(月)', time: '22:00', type: '個人戦', game: 'バックショットルーレット C', members: ['海猫うにさん', 'ジュンベルクさん', 'そーちょさん', 'いとお菓子さん'] },

    { date: '2026-04-25', displayDate: '2026-04-25(土)', time: '20:00', type: '個人戦', game: 'アルティメットチキンホース Ｃ', members: ['カルミアさん', 'ぐれーぷしゅがーさん', '海猫うにさん', 'noteさん'] },
    { date: '2026-04-25', displayDate: '2026-04-25(土)', time: '22:00', type: 'チーム戦', game: 'ガーティックフォン', 
      members: [
        '【Aチーム】：noteさん、ユッケさん、ゆらとさん、カルミアさん',
        '【Bチーム】：海猫うにさん、ぴーまんさん、いとお菓子さん、さぬきラーメンさん'
      ] 
    },
    { date: '2026-04-25', displayDate: '2026-04-25(土)', time: '22:00', type: '個人戦', game: 'ギルティギア Ｂ', members: ['カルミアさん', 'ぐれーぷしゅがーさん'] },

    { date: '2026-05-01', displayDate: '2026-05-01(金)', time: '22:00', type: '個人戦', game: 'アルティメットチキンホース Ｄ', members: ['さぬきラーメンさん', 'ゆらとさん', 'そーちょさん', 'いとお菓子さん'] },

    { date: '2026-05-07', displayDate: '2026-05-07(木)', time: '22:00', type: 'チーム戦', game: 'レインボーシックスシージ', 
      members: [
        '【Aチーム】：たちかぜさん、tuki022さん、ktさん、ジュンベルクさん、ユッケさん',
        '【Bチーム】：ぐだぐだないとさん、凍結さん、さぬきラーメンさん、海猫うにさん、ぐれーぷしゅがーさん'
      ] 
    },

    { date: '2026-05-09', displayDate: '2026-05-09(土)', time: '20:00', type: '個人戦', game: 'ギルティギア Ｄ', members: ['土星さん', '海猫うにさん'] },

    //イベント追加がある場合はここに登録する
    //コピー用
    // { date: '2026-05-09', displayDate: '2026-05-09(土)', time: '20:00', type: '個人戦', game: 'ゲーム名', members: ['xxxxさん', 'yyyyさん'] },
    { date: '2026-05-09', displayDate: '2026-05-09(土)', time: '20:00', type: '個人戦', game: 'ゲーム名', members: ['xxxxさん', 'yyyyさん'] },
    { date: '2026-05-10', displayDate: '2026-05-10(日)', time: '13:00', type: 'チーム戦', game: 'ヴァロラント', 
      members: [
        '【Aチーム】：カルミアさん、ktさん、ユッケさん、ゆらとさん、ジュンベルクさん',
        '【Bチーム】：ぐだぐだないとさん、いとお菓子さん、さぬきラーメンさん、海猫うにさん、ぐれーぷしゅがーさん'
      ] 
    }
  ];

  function populateDateSelect() {
    const select = document.getElementById('dateSelect');
    const uniqueDates = [...new Map(events.map(item => [item.date, item.displayDate])).entries()];
    uniqueDates.forEach(([dateVal, displayStr]) => {
      const option = document.createElement('option');
      option.value = dateVal;
      option.textContent = displayStr;
      select.appendChild(option);
    });
  }

  function renderEvents(filterDate = 'all') {
    const container = document.getElementById('eventContainer');
    container.innerHTML = '';

    const filteredEvents = events.filter(e => filterDate === 'all' || e.date === filterDate);

    if (filteredEvents.length === 0) {
      container.innerHTML = '<p class="empty-message">該当するイベントはありません。</p>';
      return;
    }

    filteredEvents.forEach(e => {
      const card = document.createElement('div');
      card.className = `event-card ${e.type === 'チーム戦' ? 'team' : 'solo'}`;
      const typeClass = e.type === 'チーム戦' ? 'type-team' : 'type-solo';
      
      let membersHtml = '';
      if (e.members.length > 0) {
        // チーム戦でAチーム/Bチームの記載がある場合は改行して表示
        membersHtml = '<ul class="members-list">' + e.members.map(m => `<li>${m}</li>`).join('') + '</ul>';
      } else {
        membersHtml = '<p class="no-members">メンバー未定 / 記載なし</p>';
      }

      card.innerHTML = `
        <div class="event-header">
          <div class="event-title">
            <span class="event-type ${typeClass}">${e.type}</span>
            ${e.game}
          </div>
          <div class="event-time">
            ${e.displayDate} ${e.time}
          </div>
        </div>
        <div>
          <strong>参加メンバー:</strong>
          ${membersHtml}
        </div>
      `;
      container.appendChild(card);
    });
  }

  window.onload = () => {
    populateDateSelect();
    renderEvents();
  };

  document.getElementById('dateSelect').addEventListener('change', (e) => {
    renderEvents(e.target.value);
  });
</script>

</body>
</html>
